# Spring Application Properties
spring.application.name=student-od-leave-system
server.port=8080

# Database Configuration (MySQL / H2 fallback)
spring.datasource.url=jdbc:mysql://localhost:3306/college_od_leave_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=od_leave_super_secret_jwt_key_with_at_least_256_bits_2026_antigravity
app.jwt.expiration-ms=86400000
